query GetMyBusinesses($ownerId: String!) @auth(level: PUBLIC) {
  businesses(where: { ownerId: { eq: $ownerId } }, orderBy: [{ createdAt: DESC }]) {
    id
    name
    slug
    status
    createdAt
  }
}

