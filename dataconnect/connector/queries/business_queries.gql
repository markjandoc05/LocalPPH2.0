query GetAllBusinesses($status: String) @auth(level: PUBLIC) {
  businesses(
    where: { status: { eq: $status } }
    orderBy: [{ createdAt: DESC }]
  ) {
    id
    name
    slug
    status
    ownerId
    createdAt
    category {
      name
    }
    city {
      name
    }
  }
}
