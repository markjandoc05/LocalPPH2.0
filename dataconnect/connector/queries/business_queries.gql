query SearchBusinesses($query: String, $cityId: UUID, $categoryId: UUID) @auth(level: PUBLIC) {
  businesses(
    where: {
      status: { eq: "APPROVED" }
      name: { contains: $query }
      cityId: { eq: $cityId }
      categoryId: { eq: $categoryId }
    }
    orderBy: [{ isFeatured: DESC }, { name: ASC }]
  ) {
    id
    name
    slug
    description
    category {
      name
      slug
    }
    city {
      name
    }
    province {
      name
    }
    isFeatured
    businessPhotos_on_business(where: { isPrimary: { eq: true } }) {
      photoUrl
    }
  }
}

query GetBusinessBySlug($slug: String!) @auth(level: PUBLIC) {
  businesses(where: { slug: { eq: $slug } }) {
    id
    name
    slug
    description
    status
    isVerified
    isFeatured
    contactEmail
    contactPhone
    websiteUrl
    addressLine1
    latitude
    longitude
    category {
      id
      name
      slug
    }
    subcategory {
      id
      name
    }
    city {
      name
    }
    province {
      name
    }
    region {
      name
    }
    businessPhotos_on_business {
      id
      photoUrl
      isPrimary
    }
    businessProducts_on_business {
      id
      name
      description
      price
    }
    businessServices_on_business {
      id
      name
      description
      priceRange
    }
  }
}

